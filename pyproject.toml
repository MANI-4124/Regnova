[project]
name = "regnova-backend"
version = "0.1.0"
description = "Regnova Backend API"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "sqlalchemy>=2.0",
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",
    "email-validator>=2.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    # HTTP client for the Gemini REST call in app/analysis/GeminiClaimAnalyzer
    # (Claims semantic analysis). Was a dev-only dep (TestClient pulls it); the
    # runtime now genuinely needs it. Chosen over the google-genai SDK for full
    # control over the request shape - the prompt-injection defence depends on
    # it. See CLAUDE.md "Claims semantic analysis".
    "httpx>=0.28",
    # Malware scanning (AC-FR-04-01) - a pure-Python TCP client for
    # clamd's INSTREAM protocol, no C extension, so no Windows-specific
    # build fragility (unlike python-magic, deliberately avoided
    # elsewhere in this codebase for exactly that reason). See
    # app/scanning/ and CLAUDE.md "Malware scanning".
    "clamd>=1.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]