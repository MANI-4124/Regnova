# Per-jurisdiction opt-in for the category-composition workaround - see
# scripts/load_regulatory_content.py's module docstring and CLAUDE.md
# "File-based regulatory content pipeline".
#
# Category scoping is unmodelled in this codebase today: ProductMarketState
# has no category column, and the auto-pin mechanism requires
# RegulatoryBasisRelease.jurisdiction == market exactly. A jurisdiction that
# only ever has ONE category doesn't need any workaround at all - plain
# jurisdiction works fine as market. Only list a jurisdiction here if it
# genuinely has more than one category's worth of content, in which case
# the loader composes jurisdiction/market as "<jurisdiction>-<CATEGORY>"
# for every file under it (see compute_market()).
#
# Never add a jurisdiction here that already has real content seeded under
# a plain-jurisdiction market value (e.g. via scripts/seed_regulatory_sources.py)
# - composing it later would produce a second, disconnected market string
# for the same real jurisdiction, and existing ProductMarketState rows
# pinned to the old value would never see releases created under the new
# one. See CLAUDE.md for the full compatibility note.

multi_category: []
